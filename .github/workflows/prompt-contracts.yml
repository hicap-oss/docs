name: Prompt contracts
on:
  pull_request:
    paths:
      - 'onboarding-prompts/**'
      - 'concepts/implement-attribution-with-an-agent.mdx'
      - 'scripts/*prompts.test.cjs'
      - 'quickstart.mdx'
      - 'concepts/tags-dimensions-segments.mdx'
      - 'docs.json'
      - 'openapi.json'
      - 'api-reference/**'
      - 'faq.mdx'
      - 'scripts/api-contracts.test.cjs'
      - '.github/workflows/prompt-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'onboarding-prompts/**'
      - 'concepts/implement-attribution-with-an-agent.mdx'
      - 'scripts/*prompts.test.cjs'
      - 'docs.json'
      - 'openapi.json'
      - 'api-reference/**'
      - 'faq.mdx'
      - 'scripts/api-contracts.test.cjs'
      - '.github/workflows/prompt-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/*prompts.test.cjs scripts/api-contracts.test.cjs
